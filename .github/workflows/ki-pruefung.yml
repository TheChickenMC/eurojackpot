# VORUEBERGEHEND (wird nach der Pruefung wieder geloescht): laedt jedes empfohlene KI-Modell aus KiKatalog mit derselben
# llama.cpp-Version wie in den Programmen (b11565, hier die Linux-Ausgabe) und stellt ihm Fragen wie im KI-Assistenten.
# Grosse Modelle (mehr als der Arbeitsspeicher des Testrechners) nur kurz: laden und zwei Fragen.
name: KI-Pruefung

on:
  workflow_dispatch:
    inputs:
      bau:
        description: 'Entwurfs-Release mit EuroJackpot.jar'
        required: true

permissions:
  contents: write

jobs:
  pruefen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nr: 0
          - nr: 1
          - nr: 2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: Vorbereiten
        run: |
          gh release download "${{ inputs.bau }}" -R "$GITHUB_REPOSITORY" -p EuroJackpot.jar
          D=llama-b11565-bin-ubuntu-x64.tar.gz
          curl -fsSL --retry 3 -o "$D" "https://github.com/ggml-org/llama.cpp/releases/download/b11565/$D"
          echo "c571742335d8b3d9a7a15773907d1b0c7d948ece274e88fa17bd77176ad52638  $D" | sha256sum -c -
          mkdir llama && tar -xzf "$D" -C llama
          S=$(find "$PWD/llama" -name llama-server -type f | head -1)
          echo "SERVER=$S" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$S")" >> "$GITHUB_ENV"
          sudo mkdir -p /mnt/ki && sudo chown "$USER" /mnt/ki
          df -h /mnt; free -g; nproc; lscpu | grep -E 'Model name|Flags' | cut -c1-200
          mkdir probe
          javac --release 26 -encoding UTF-8 -nowarn -cp EuroJackpot.jar -d probe .github/mac/MacProbe.java
          LD_LIBRARY_PATH=$(dirname "$S") "$S" --version
      - name: Modell pruefen
        run: |
          java -Xmx512m -cp EuroJackpot.jar:probe eurojackpot.MacProbe modell ergebnis ${{ matrix.nr }} "$SERVER" /mnt/ki ${{ matrix.kurz }}
      - name: Ergebnis
        if: always()
        run: cat ergebnis/*.txt || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: modell-${{ matrix.nr }}
          path: ergebnis
          if-no-files-found: ignore
