# EuroJackpot PRO-Abo
#
# Solange hier nichts eingetragen ist, ist das Abo AUS und alle Funktionen sind frei.
# Ausgefuellt (siehe ABO-ANLEITUNG.txt) brauchen Vorhersage, Diagramm und KI-Assistent ein PRO-Abo.
#
# Hier stehen NUR oeffentliche Angaben (Shop-Links und IDs) – KEINE Passwoerter, KEINE API-Schluessel,
# KEIN Name und KEINE IBAN. Die Bankverbindung traegst du nur im Dashboard des Zahlungsanbieters ein.
# Die Datei landet so in der App (PC, Handy, iPhone/Browser) – alles hier kann jeder sehen.

# polar oder lemonsqueezy
anbieter=

# Link zum Kaufen (Checkout-Link aus dem Dashboard), beginnt mit https://
kaufen=

# Link zum Kundenportal (Abo verwalten und kuendigen)
#   Polar:         https://polar.sh/DEIN-NAME/portal
#   Lemon Squeezy: https://DEIN-LADEN.lemonsqueezy.com/billing
verwalten=

# Polar: Organization ID (Dashboard -> Settings -> General, sieht aus wie 1a2b3c4d-....)
organisation=

# Lemon Squeezy: Store ID (Zahl) und optional Product ID (Zahl)
laden=
produkt=

# Preis und Laufzeit, nur fuer die Anzeige (abgerechnet wird beim Anbieter)
preis=2,99 €
tage=28

# Optional: Links zu deinen Rechtstexten (Impressum, Datenschutz, AGB)
agb=
datenschutz=
impressum=
